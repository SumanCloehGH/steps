name: create multiple steps
on: push
jobs:
    my-job:
        runs-on: ubuntu-latest
        
        steps:

            - name: adding the repository information to the runner
              uses: actions/checkout@v3
              with:
                fetch-depth: 0

            - name: Step 1 - Hello
              run: echo "Hello World"

            - name: Step 2 - List Files
              run: ls -la
              
            - name: Step 3 - Print Date
              run: date

            # - name: Step 4 - Show git branch
            #   run: git branch

